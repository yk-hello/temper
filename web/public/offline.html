<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0C10" />
    <title>Temper · 连不上</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #0A0C10; color: #e8e8ea; font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 12px; max-width: 420px; margin: 0 auto; padding: 0 24px; box-sizing: border-box; }
      i { width: 9px; height: 9px; background: #fff; display: block; margin-bottom: 8px; }
      h1 { margin: 0; font-size: 18px; font-weight: 500; }
      p { margin: 0; color: #8a8a93; font-size: 13px; }
      button { margin-top: 8px; height: 32px; padding: 0 14px; border: 0; border-radius: 3px; background: #fff; color: #000; font: inherit; font-weight: 500; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <i></i>
      <h1>连不上服务器</h1>
      <p>网络断了，或者部署这个软件的服务器没开。仓位和挂单都在服务器（或交易所）上，不会因为这里断开而丢失。</p>
      <p lang="en">Cannot reach the server. Positions and orders live on the server or the exchange and are not affected.</p>
      <button type="button" onclick="location.reload()">重试 · Retry</button>
    </main>
  </body>
</html>
