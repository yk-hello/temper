# 页面文件有两层：
#   /srv/live —— 开发时 Claude 直接放进 web/live 文件夹的新版本（存在就优先用，刷新浏览器即生效，不用重建容器）
#   /usr/share/nginx/html —— 构建进镜像的正式版本
# web/live 为空时，自动用正式版本。
# 推送要升级成 WebSocket；普通请求不升级（/bapi/ 两种都有）
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  sendfile off;   # Windows 挂载进来的文件用 sendfile 可能读到旧内容

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;   # 后端按来源算登录失败和注册次数
  }

  # qsig/1 信号接口（程序化策略发目标仓位，见 docs/qsig-1.md）
  location /v1/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;   # 后端按来源算登录失败和注册次数
    client_max_body_size 300k;
  }

  # 和币安一样的接口（模拟盘）：/bapi/fapi/... 和账户推送 /bapi/ws/<listenKey>
  location /bapi/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;   # 后端按来源限流
    proxy_read_timeout 3600s;
    client_max_body_size 64k;
  }

  location /ws {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;   # 后端按来源算登录失败和注册次数
    proxy_set_header Origin $http_origin;
    proxy_read_timeout 3600s;
  }

  location /assets/ {
    root /srv/live;
    try_files $uri @built_assets;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location @built_assets {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = / {
    root /srv/live;
    try_files /index.html @built;
    add_header Cache-Control "no-cache";
  }
  location / {
    root /srv/live;
    try_files $uri @built;
    add_header Cache-Control "no-cache";
  }
  location @built {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
