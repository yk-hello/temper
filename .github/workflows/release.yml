# 发布现成的 Docker 镜像（18 第 8.3 条）：推一个 v 开头的标签（比如 v0.1.0）时，构建后端和网页两个镜像，
# 推到这个仓库所属账号的 GitHub 容器仓库（ghcr.io/<账号>/qs-backend、qs-web），同时打上版本号和 latest。
# 用的人在 .env 里写 QS_BACKEND_IMAGE、QS_WEB_IMAGE，再 docker compose pull && docker compose up -d，就不用在本机构建。
# 仓库是私有的时候跳过；公开以后自动生效。不需要额外配置密钥（用 GitHub 自带的 GITHUB_TOKEN）。
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        part: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/qs-${{ matrix.part }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.part }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
